# Desktop guest kernel for a SunSlop seat.
#
# apply-desktop-kernel.sh splices this into
# nvkvm-kata/kata/fragments/gpu/nvkvm.x86_64.conf.in. That is the only
# file `build-kernel.sh -g nvkvm` reads. A copy left beside it as
# desktop.x86_64.conf is not merged on its own.
#
# Build with --graphics 1. That merges nvkvm-graphics.x86_64.conf, which is
# what Steam on nvkvm-steam actually uses for the display:
#   CONFIG_DRM=y
#   CONFIG_DRM_KMS_HELPER=y
#   CONFIG_DRM_GEM_SHMEM_HELPER=y
# Those stay in the graphics fragment. This file does not set CONFIG_DRM,
# and it does not set CONFIG_DRM_VIRTIO_GPU. An emulated VGA would take
# /dev/dri/card0; the shim passes -vga none so the virtio-nvgpu node is
# the one labwc binds. Do not set LOCALVERSION or MODULE_SIG_FORCE.
# Module signing uses the site key from deploy/kata/secureboot.sh, not a
# line in this fragment. CONFIG_MODULE_SIG_FORCE would refuse an unsigned
# nvkvm-guest.ko and the seat would have no GPU.
#
# Every symbol here is =y. The kata rootfs ships no /lib/modules tree
# for this kernel (nvkvm only injects nvkvm-guest.ko), so =m would never
# appear in the seat. NTSYNC needs a guest >= 6.14. The nvkvm tree is 6.18.
#
# Parents that allnoconfig leaves off are set here too. INPUT_UINPUT is
# inside INPUT_MISC. HIDRAW, UHID, and HID_GENERIC are inside HID_SUPPORT
# and HID. HID_PID is not a 6.18 symbol, and USB force-feedback is useless
# without a USB controller. SQUASHFS_DECOMP_MULTI is a hidden def_bool;
# SQUASHFS_COMPILE_DECOMP_MULTI selects it. The squashfs compressors
# select their decompressors. UDMABUF is not set: it depends on
# MEMFD_CREATE, which the memfd hook turns on after this fragment merges.

# --- input: evdev nodes, and the uinput Sunshine uses for gamepads ---
CONFIG_INPUT_MISC=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_JOYDEV=y
CONFIG_INPUT_FF_MEMLESS=y
CONFIG_INPUT_UINPUT=y

# Steam Input's virtual controllers. Not a USB bus.
CONFIG_HID_SUPPORT=y
CONFIG_HID=y
CONFIG_HIDRAW=y
CONFIG_HID_GENERIC=y
CONFIG_UHID=y

# Proton's NT sync device, /dev/ntsync. Kernel >= 6.14. Built-in, not =m.
CONFIG_NTSYNC=y

# pressure-vessel (Steam Linux Runtime) enters a user namespace. Kata's
# base config usually has this; say it so an allnoconfig cannot drop it.
CONFIG_USER_NS=y

# Steam Linux Runtime images, and overlay upper dirs inside the seat.
CONFIG_FUSE_FS=y
CONFIG_FUSE_PASSTHROUGH=y
CONFIG_FUSE_IO_URING=y
CONFIG_OVERLAY_FS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_FILE_DIRECT=y
CONFIG_SQUASHFS_COMPILE_DECOMP_MULTI=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZSTD=y

# pressure-vessel / bubblewrap, and Wine's optional binfmt.
CONFIG_BINFMT_MISC=y
CONFIG_BINFMT_SCRIPT=y
CONFIG_USERFAULTFD=y
CONFIG_CHECKPOINT_RESTORE=y

# 32-bit games and older Proton prefixes. modify_ldt is the non-EXPERT
# default; ask for it so an EXPERT build does not drop Wine.
CONFIG_IA32_EMULATION=y
CONFIG_MODIFY_LDT_SYSCALL=y

# A dummy ALSA card so PipeWire and Proton have /dev/snd without a host
# sound device. Sunshine records the PipeWire monitor, not this card.
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_TIMER=y
CONFIG_SND_PCM=y
CONFIG_SND_HRTIMER=y
CONFIG_SND_DUMMY=y
CONFIG_SND_SEQUENCER=y
CONFIG_SND_SEQ_DUMMY=y

# OVMF Secure Boot exposes EFI variables. DMI so games can read a machine id.
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFIVAR_FS=y
CONFIG_DMI=y
CONFIG_DMIID=y

# GameMode's uclamp hints need schedutil. Kata already builds the
# performance governor and keeps it as the default.
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
CONFIG_UCLAMP_TASK=y
CONFIG_UCLAMP_TASK_GROUP=y
CONFIG_SCHED_AUTOGROUP=y
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y

# Low-latency desktop preemption, 1 kHz tick, and a readable /proc/config.gz
# so the node gate can see this fragment actually landed.
CONFIG_PREEMPT=y
CONFIG_HZ_1000=y
CONFIG_PSI=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_CROSS_MEMORY_ATTACH=y

# virtio-mem grows the guest from KATA_MEMORY_MIB up to KATA_MAX_MEMORY_MIB.
# The balloon returns pages the guest has freed. Both are built-in: this
# rootfs has no /lib/modules tree. virtio-mem onlines its own blocks.
CONFIG_MEMORY_HOTPLUG=y
CONFIG_MEMORY_HOTREMOVE=y
CONFIG_MHP_DEFAULT_ONLINE_TYPE_ONLINE_MOVABLE=y
CONFIG_CONTIG_ALLOC=y
CONFIG_BALLOON_COMPACTION=y
CONFIG_VIRTIO_BALLOON=y
CONFIG_VIRTIO_MEM=y
