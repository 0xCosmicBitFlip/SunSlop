[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log

[program:dbus]
priority=10
user=@GS_USER@
environment=XDG_RUNTIME_DIR="@XDG_RUNTIME_DIR@",HOME="@GS_HOME@",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
command=/usr/bin/dbus-daemon --session --address=unix:path=@XDG_RUNTIME_DIR@/bus --nofork --nopidfile
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pipewire]
priority=20
user=@GS_USER@
environment=XDG_RUNTIME_DIR="@XDG_RUNTIME_DIR@",HOME="@GS_HOME@",USER="@GS_USER@",DBUS_SESSION_BUS_ADDRESS="unix:path=@XDG_RUNTIME_DIR@/bus",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
command=/usr/bin/pipewire
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:wireplumber]
priority=30
user=@GS_USER@
environment=XDG_RUNTIME_DIR="@XDG_RUNTIME_DIR@",HOME="@GS_HOME@",USER="@GS_USER@",DBUS_SESSION_BUS_ADDRESS="unix:path=@XDG_RUNTIME_DIR@/bus",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
command=/usr/bin/wireplumber
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pipewire-pulse]
priority=30
user=@GS_USER@
environment=XDG_RUNTIME_DIR="@XDG_RUNTIME_DIR@",HOME="@GS_HOME@",USER="@GS_USER@",DBUS_SESSION_BUS_ADDRESS="unix:path=@XDG_RUNTIME_DIR@/bus",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
command=/usr/bin/pipewire-pulse
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:labwc]
priority=40
user=@GS_USER@
environment=XDG_RUNTIME_DIR="@XDG_RUNTIME_DIR@",HOME="@GS_HOME@",USER="@GS_USER@",WAYLAND_DISPLAY="@WAYLAND_DISPLAY@",DBUS_SESSION_BUS_ADDRESS="unix:path=@XDG_RUNTIME_DIR@/bus",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
command=/usr/bin/labwc
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:sunshine]
priority=50
user=@GS_USER@
environment=XDG_RUNTIME_DIR="@XDG_RUNTIME_DIR@",HOME="@GS_HOME@",USER="@GS_USER@",WAYLAND_DISPLAY="@WAYLAND_DISPLAY@",DBUS_SESSION_BUS_ADDRESS="unix:path=@XDG_RUNTIME_DIR@/bus",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
command=sunshine
directory=@GS_HOME@
autorestart=true
startretries=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:selkies]
priority=50
user=@GS_USER@
environment=XDG_RUNTIME_DIR="@XDG_RUNTIME_DIR@",HOME="@GS_HOME@",USER="@GS_USER@",WAYLAND_DISPLAY="@WAYLAND_DISPLAY@",DBUS_SESSION_BUS_ADDRESS="unix:path=@XDG_RUNTIME_DIR@/bus",SELKIES_ENCODER="@SELKIES_ENCODER@",SELKIES_PORT="@SELKIES_PORT@",SELKIES_ADDR="@SELKIES_ADDR@",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
command=selkies
directory=@GS_HOME@
autorestart=true
startretries=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
