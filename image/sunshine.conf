# First-boot Sunshine config. seat-boot.py rewrites the port family from the
# seat env on every start (SUNSHINE_BASE_PORT and the offsets in gs-config).
# Capture the labwc session. Do not switch this to kms: the virtual head does not
# complete the nvidia-modeset scanout path, and a DRM capture that goes through
# libnvidia-egl-gbm stalls.
capture = wlr
encoder = nvenc
port = 47989
address_family = ipv4
origin_web_ui_allowed = lan
file_state = sunshine_state.json
